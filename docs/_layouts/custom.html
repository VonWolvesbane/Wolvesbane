<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
</head>

<body>

    <!-- Top Header Bar -->
    <header class="site-header">

        <!-- Logo Left -->
        <div class="logo-container">
            <a href="{{ '/' | relative_url }}">
                <img src="{{ '/images/site_logo.png' | relative_url }}" class="site-logo">
            </a>
        </div>

        <!-- Site Title (optional) -->
        <div class="site-title">
            Wolvesbane Wiki
        </div>

    </header>

    <!-- Page Banner -->
    <div class="banner-container">
        <img src="{{ page.banner | relative_url }}" class="page-banner">
    </div>

    <div class="page-content">
        {{ content }}
    </div>

</body>
</html>
