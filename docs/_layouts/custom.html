<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
</head>

<body>

  <!-- ================= HEADER ROW ================= -->
  <div class="header-row">

    <!-- Left Logo -->
    <div class="header-left">
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/images/site_logo.png' | relative_url }}" class="header-logo" alt="Site Logo">
      </a>
    </div>

    <!-- Center Banner (GLOBAL - same for all pages) -->
    <div class="header-center">
      <img src="{{ '/images/site_banner.png' | relative_url }}" class="header-banner" alt="Wolvesbane Banner">
    </div>

    <!-- Right Logo -->
    <div class="header-right">
      <img src="{{ '/images/site_logo.png' | relative_url }}" class="header-logo" alt="Site Logo">
    </div>

  </div>

  <!-- ================= NAVIGATION ================= -->
  <nav class="nav-bar">
  <a class="{% if page.url contains '/monsters/' %}active{% endif %}" href="{{ '/monsters/' | relative_url }}">Monsters</a>
  <a class="{% if page.url contains '/tamables/' %}active{% endif %}" href="{{ '/tamables/' | relative_url }}">Tamables</a>
  <a class="{% if page.url contains '/items/' %}active{% endif %}" href="{{ '/items/' | relative_url }}">Items</a>
  <a class="{% if page.url contains '/armor/' %}active{% endif %}" href="{{ '/armor/' | relative_url }}">Armor</a>
  <a class="{% if page.url contains '/weapons/' %}active{% endif %}" href="{{ '/weapons/' | relative_url }}">Weapons</a>
</nav>


  <!-- ================= PAGE CONTENT ================= -->
  <div class="page-content">
    {{ content }}
  </div>

</body>
</html>
