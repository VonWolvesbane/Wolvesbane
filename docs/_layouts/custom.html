<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
</head>

<body>

  <!-- ================= HEADER ROW ================= -->
  <div class="header-row">

    <!-- Left Logo -->
    <div class="header-left">
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/images/site_logo.png' | relative_url }}" class="header-logo" alt="Site Logo">
      </a>
    </div>

    <!-- Center Banner (GLOBAL - same for all pages) -->
    <div class="header-center">
      <img src="{{ '/images/site_banner.jpg' | relative_url }}" class="header-banner" alt="Wolvesbane Banner">
    </div>

    <!-- Right Logo -->
    <div class="header-right">
      <img src="{{ '/images/site_logo.png' | relative_url }}" class="header-logo" alt="Site Logo">
    </div>

  </div>

  <!-- ================= NAVIGATION ================= -->
  <nav class="nav-bar">
    <a href="{{ '/monsters/' | relative_url }}">Monsters</a>
    <a href="{{ '/tamables/' | relative_url }}">Tamables</a>
    <a href="{{ '/items/' | relative_url }}">Items</a>
    <a href="{{ '/armor/' | relative_url }}">Armor</a>
    <a href="{{ '/weapons/' | relative_url }}">Weapons</a>
  </nav>

  <!-- ================= PAGE CONTENT ================= -->
  <div class="page-content">
    {{ content }}
  </div>

</body>
</html>
